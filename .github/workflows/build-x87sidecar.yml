# Builds athei's x87sidecar (MIT) from the commit inputs.json pins, for the Wine 11 engines. Wine
# re-executes a 32-bit program through it when ROSETTA_X87_PATH names it (patches/0012, cooperative
# attach, no entitlements), which Highball sets only for games the database opts in. Manual
# dispatch, nothing published unless asked.
# The same executable handles verified AoE IV launches via Wine patch 0032.
name: build-x87sidecar
on:
  push:
    paths:
      - ".github/workflows/build-x87sidecar.yml"
      - "inputs.json"
      - "x87sidecar/patches/*.patch"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the patched x87sidecar archive as a GitHub release"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: source identity
        id: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          source = json.load(open("inputs.json"))["x87sidecar"]
          identity = {key: source.get(key, "") for key in ("repo", "commit", "tag")}
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("key=" + hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest(), file=out)
          with open(os.environ["GITHUB_ENV"], "a") as out:
              print("HELPER_REPO=" + source["repo"], file=out)
              print("HELPER_COMMIT=" + source["commit"], file=out)
              print("HELPER_VERSION=" + (source.get("tag") or source["commit"][:12]), file=out)
          PY
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: helper
        with:
          path: ${{ runner.temp }}/sidecar-out
          key: sidecar-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.key }}-${{ steps.source.outputs.toolchain }}-${{ hashFiles('.github/workflows/build-x87sidecar.yml', 'x87sidecar/patches/*.patch') }}
      - name: pinned source
        if: steps.helper.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout "$HELPER_REPO" src
          git -C src checkout --quiet --detach "$HELPER_COMMIT"
          [[ "$(git -C src rev-parse HEAD)" == "$HELPER_COMMIT" ]]
          git -C src log --oneline -1
          for patch in "$PWD"/x87sidecar/patches/*.patch; do
            git -C src apply --index "$patch"
          done
      - name: build
        if: steps.helper.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --target x87sidecar -j "$(sysctl -n hw.ncpu)"
          [[ "$(lipo -archs build/bin/x87sidecar)" == arm64 ]]
          file build/bin/x87sidecar
      - name: package
        if: steps.helper.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # A partial cache match must never leave an older archive in this output.
          rm -rf "$RUNNER_TEMP/sidecar-out"
          name="x87sidecar-$HELPER_VERSION-$(date -u +%Y%m%dT%H%M%SZ)"
          out="$RUNNER_TEMP/sidecar-package"; mkdir -p "$out/x87sidecar" "$RUNNER_TEMP/sidecar-out"
          cp build/bin/x87sidecar "$out/x87sidecar/"
          cp src/LICENSE "$out/x87sidecar/LICENSE"
          git -C src rev-parse HEAD > "$out/x87sidecar/SOURCE_COMMIT"
          tree=$(git -C src write-tree)
          echo "$tree" > "$out/x87sidecar/SOURCE_TREE"
          codesign -f -s - "$out/x87sidecar/x87sidecar"
          codesign --verify --strict "$out/x87sidecar/x87sidecar"
          tar -C "$out" -cJf "$RUNNER_TEMP/sidecar-out/$name.tar.xz" x87sidecar
          git -C src archive --format=tar.gz --output="$RUNNER_TEMP/sidecar-out/$name-source.tar.gz" "$tree"
          (cd "$RUNNER_TEMP/sidecar-out" && shasum -a 256 "$name.tar.xz" > "$name.tar.xz.sha256"
           shasum -a 256 "$name-source.tar.gz" > "$name-source.tar.gz.sha256")
      - name: verify archives
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sidecar-out"
          shasum -a 256 -c ./*.sha256
          [[ "$(tar -xOf ./*.tar.xz x87sidecar/SOURCE_COMMIT)" == "$HELPER_COMMIT" ]]
      - uses: actions/upload-artifact@v4
        with:
          name: x87sidecar
          path: ${{ runner.temp }}/sidecar-out/*
          if-no-files-found: error
      - name: publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=("$RUNNER_TEMP/sidecar-out/"*.tar.xz)
          name=$(basename "${archive[0]}" .tar.xz)
          if ! gh release view "$name" >/dev/null 2>&1; then
            gh release create "$name" "$RUNNER_TEMP/sidecar-out/"* --target "$GITHUB_SHA" --title "$name" --notes "x87sidecar (MIT), $HELPER_REPO at $HELPER_COMMIT plus the helper patch series at $GITHUB_SHA."
          fi
