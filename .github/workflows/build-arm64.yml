# The arm64 engine line: upstream Wine built natively for Apple silicon, with ARM64X builtins and
# FEX for x86 programs, for the day macOS 28 drops Rosetta (Highball's
# private/notes/rosetta-transition-plan.md; the spike that measured every step ran on an M4 on
# 2026-10-04). Manual dispatch only. The tarball's own loader is for development: Highball replaces
# it with its signed WineLoader.app at install, because the kernel only grants Apple's
# cross-architecture entitlement to a signed bundle with a provisioning profile.
#
# What this build has: a prefix that boots in seconds, both halves populated, 32-bit and 64-bit x86
# programs at Rosetta speed on a compute loop, Vulkan through MoltenVK. What it lacks: a renderer
# overlay. DXMT needs the Mac driver's Metal glue, which upstream Wine does not carry (CrossOver's
# tree does), so no overlay is packaged here until CrossOver 27's sources are out or the glue is
# ported. GStreamer is the official macOS framework, pruned to what winegstreamer uses
# (gstreamer/prune.py), in frameworks/ as for the Intel engines.
#
# FEX: built from FEX 2610 with the series in fex/patches/ (the default since 2026-10-11, the owner's
# decision). With fex_build: hangover it takes Hangover 11.16's FEX 2608 DLLs instead.
name: build-engine-arm64
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the tarball as a GitHub release (tag engine-arm64-<wine version>-<date>)"
        type: boolean
        default: false
      ref_note:
        description: "why this build (free text, goes in the artifact name)"
        required: false
        default: "manual"
      fex_build:
        description: "FEX DLLs: source (FEX 2610 + fex/patches/, see fex/README.md) or hangover (Hangover 11.16, FEX 2608)"
        type: choice
        options: [source, hangover]
        default: source
permissions:
  contents: write
jobs:
  build:
    # Apple silicon runner on purpose: the Unix side is native arm64.
    runs-on: macos-26
    timeout-minutes: 300
    env:
      FEX_BUILD: ${{ github.event.inputs.fex_build || 'source' }}
      # Binaries built against an SDK older than 26.5 keep x18, the register Windows ARM64 code
      # holds its thread block in, across context switches (CodeWeavers' interim rule, wine-devel
      # 2026-08-07). It only matters for the loader, and Highball's signed loader sets it too.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: pinned sources
        run: |
          set -euo pipefail
          fetch() { # name -> downloads inputs-arm64.json[name] into $2 and checks its sha
            url=$(python3 -c "import json;print(json.load(open('inputs-arm64.json'))['$1']['url'])")
            sha=$(python3 -c "import json;print(json.load(open('inputs-arm64.json'))['$1']['sha256'])")
            curl -sSL --retry 3 -o "$2" "$url"
            echo "$sha  $2" | shasum -a 256 -c -
          }
          fetch wine wine.tar.xz
          fetch llvm-mingw llvm-mingw.tar.xz
          mkdir -p src toolchains/llvm-mingw fex-dlls
          tar -xJf wine.tar.xz -C src
          tar -xJf llvm-mingw.tar.xz -C toolchains/llvm-mingw --strip-components 1
          if [ "$FEX_BUILD" = hangover ]; then
            fetch fex hangover_dlls.tar
            tar -xf hangover_dlls.tar -C fex-dlls
          fi
          ls src; ls fex-dlls
      - name: apply patch series
        run: |
          set -euo pipefail
          cd src/wine-*/
          for p in ../../patches-arm64/*.patch; do echo "applying $p"; patch -p1 < "$p"; done
      - name: toolchain
        run: |
          set -euo pipefail
          # MoltenVK and the Vulkan headers for winevulkan. GStreamer comes from its own framework (next step).
          brew install -q bison pkg-config ccache gnutls freetype sdl2 libpng jpeg-turbo molten-vk vulkan-headers || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$PWD/toolchains/llvm-mingw/bin" >> "$GITHUB_PATH"
          toolchains/llvm-mingw/bin/arm64ec-w64-mingw32-clang --version | head -1
          toolchains/llvm-mingw/bin/ld.lld --version | head -1
          clang --version | head -1
      # GStreamer for winegstreamer, which Media Foundation and DirectShow need to play games' videos
      # (MP4 and H.264, WMV, WebM, Ogg). The official macOS framework, nothing installed: both packages
      # are expanded flat and gstreamer/unpkg.py unpacks only the components in inputs-arm64.json into
      # frameworks/GStreamer.framework (the whole devel package would be 4.7 GB). gstreamer/prune.py then
      # keeps the plugins Wine can use and the libraries they link, thinned to arm64. The licence texts
      # come from the devel package. Wine is built against a copy with the core and GLib headers.
      - name: GStreamer
        run: |
          set -euo pipefail
          field() { python3 -c "import json;v=json.load(open('inputs-arm64.json'))['gstreamer']['$1'];print(' '.join(v) if isinstance(v,list) else v)"; }
          V=$(field version)
          for p in runtime devel; do
            # gstreamer.freedesktop.org closes transfers early at times: resume up to eight times.
            for try in 1 2 3 4 5 6 7 8; do curl -sSL --http1.1 -C - -o "gst-$p.pkg" "$(field ${p}_url)" && break; echo "download of $p interrupted, resuming ($try)"; sleep 10; done
            echo "$(field ${p}_sha256)  gst-$p.pkg" | shasum -a 256 -c -
            pkgutil --expand "gst-$p.pkg" "gst-$p"
          done
          F=out/frameworks/GStreamer.framework
          S=gst-sdk/GStreamer.framework/Versions/1.0
          python3 gstreamer/unpkg.py "gst-runtime/osx-framework-$V-universal.pkg" "$F"
          for c in $(field components); do python3 gstreamer/unpkg.py "gst-runtime/$c-$V-universal.pkg" "$F/Versions/1.0"; done
          mkdir -p gst-sdk && ditto "$F" gst-sdk/GStreamer.framework
          python3 gstreamer/unpkg.py "gst-devel/base-system-1.0-devel-$V-universal.pkg" "$S" './include/*' './lib/glib-2.0/*'
          python3 gstreamer/unpkg.py "gst-devel/gstreamer-1.0-core-devel-$V-universal.pkg" "$S" './include/*'
          python3 gstreamer/prune.py "$F" --thin
          for c in $(field components); do
            d="gst-devel/$c-devel-$V-universal.pkg"
            if [ -d "$d" ]; then python3 gstreamer/unpkg.py "$d" "$F/Versions/1.0" './share/licenses/*'; fi
          done
          cp gst-runtime/Resources/license.txt "$F/Versions/1.0/share/licenses/gstreamer-installer-license.txt"
          ls "$F/Versions/1.0/share/licenses"
          du -sh "$F"
          rm -rf gst-runtime gst-devel gst-runtime.pkg gst-devel.pkg
          echo "GST_SDK=$PWD/$S" >> "$GITHUB_ENV"
      # FEX 2610 with the x86-64 fidelity series (fex/README.md). Both DLLs come from one source tree:
      # libarm64ecfex.dll (x86-64 through ARM64EC) and libwow64fex.dll (x86 through WoW64). The tag's
      # submodule commits are the pinned ones.
      - name: FEX from source
        if: ${{ env.FEX_BUILD == 'source' }}
        run: |
          set -euo pipefail
          field() { python3 -c "import json;v=json.load(open('inputs-arm64.json'))['fex-source']['$1'];print(' '.join(v) if isinstance(v,list) else v)"; }
          git clone -q --depth 1 --branch "$(field tag)" "$(field url)" fex-src
          test "$(git -C fex-src rev-parse HEAD)" = "$(field commit)"
          git -C fex-src submodule update -q --init $(field submodules)
          for p in fex/patches/*.patch; do echo "applying $p"; git -C fex-src apply "../$p"; done
          brew install -q ninja || true
          for t in arm64ec:arm64ecfex aarch64:wow64fex; do
            triple=${t%%:*}; target=${t##*:}
            cmake -G Ninja -S fex-src -B "fexbuild-$triple" -DCMAKE_TOOLCHAIN_FILE="$PWD/fex-src/Data/CMake/toolchain_mingw.cmake" \
              -DMINGW_TRIPLE="$triple-w64-mingw32" -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=False -DBUILD_TESTING=OFF \
              -DENABLE_ASSERTIONS=OFF -DBUILD_FEXCONFIG=OFF -DTUNE_CPU=generic -DTUNE_ARCH=generic > "fexbuild-$triple.log" \
              || { tail -40 "fexbuild-$triple.log"; exit 1; }
            ninja -C "fexbuild-$triple" "$target"
          done
          cp fexbuild-arm64ec/Bin/libarm64ecfex.dll fexbuild-aarch64/Bin/libwow64fex.dll fex-dlls/
          ls -la fex-dlls
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-arm64-${{ runner.os }}-${{ hashFiles('inputs-arm64.json', 'patches-arm64/**') }}
          restore-keys: ccache-arm64-${{ runner.os }}-
      # The host compiler is Apple's by absolute path: llvm-mingw is first on PATH for the PE
      # cross compilers and ships a plain `clang` that knows no macOS SDK (first dispatch,
      # 2026-10-05: "C compiler cannot create executables").
      # The configure line the spike used, plus the libraries a real engine needs for fonts, TLS
      # and controllers. arm64ec is the PE architecture x86-64 programs call into, aarch64 the
      # native one (the two are linked into ARM64X images), i386 is the WoW64 half.
      - name: configure and build
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          ../src/wine-*/configure \
            --prefix="$PWD/../out/engine" \
            --enable-archs=arm64ec,aarch64,i386 \
            --with-mingw \
            --without-x --without-alsa --without-capi --with-coreaudio --without-cups --without-dbus \
            --without-fontconfig --with-freetype --with-gnutls --without-gphoto --with-gstreamer \
            --without-krb5 --without-netapi --without-oss --without-pulse \
            --without-sane --with-sdl --without-udev --without-usb --without-v4l2 \
            --without-pcap --without-ffmpeg --disable-tests --with-vulkan \
            CPPFLAGS="-I$(brew --prefix vulkan-headers)/include" LDFLAGS="-L$(brew --prefix molten-vk)/lib" \
            GSTREAMER_CFLAGS="-I$GST_SDK/include/gstreamer-1.0 -I$GST_SDK/include/glib-2.0 -I$GST_SDK/lib/glib-2.0/include -I$GST_SDK/include" \
            GSTREAMER_LIBS="-L$GST_SDK/lib -lgstvideo-1.0 -lgstaudio-1.0 -lgsttag-1.0 -lgstbase-1.0 -lgstreamer-1.0 -lgobject-2.0 -lglib-2.0 -lintl -Wl,-rpath,@loader_path/../../GStreamer.framework/Versions/1.0/lib" \
            CC="ccache /usr/bin/clang" CXX="ccache /usr/bin/clang++" \
            arm64ec_CC="ccache arm64ec-w64-mingw32-clang" aarch64_CC="ccache aarch64-w64-mingw32-clang" \
            i386_CC="ccache i686-w64-mingw32-clang"
          make -j"$(sysctl -n hw.ncpu)"
          make install-lib
          # Headers, import libraries and winebuild for renderers built against this Wine (DXMT's
          # winemetal links winecrt0 and ntdll for its own architecture), kept out of the engine.
          make install-dev prefix="$PWD/../sdk"
          grep -E "SONAME_LIB(VULKAN|FREETYPE|GNUTLS|SDL2) " include/config.h
          test -f ../out/engine/lib/wine/aarch64-unix/winegstreamer.so
      - name: FEX
        run: |
          set -euo pipefail
          U=out/engine/lib/wine/aarch64-unix; W=out/engine/lib/wine/aarch64-windows
          # FEX's Windows DLLs load a Unix helper by name from the ntdll.so directory and fall back
          # to raw Linux syscalls without it, which macOS kills. The Darwin helper: same table, BSD
          # calls, TSO through thread_set_x86_64_compat (entitled).
          for n in libarm64ecfex libwow64fex; do
            /usr/bin/clang++ -std=c++17 -O2 -shared -fPIC -o "$U/$n.so" fex/fexunixlib_darwin.cpp
            codesign -f -s - "$U/$n.so"
          done
          # Under Wine's default emulator names: the registry key is per prefix, the file names are
          # not. Wine's own xtajit64.dll is a stub that prints "x64 emulation not implemented".
          mv "$W/xtajit64.dll" "$W/xtajit64.dll.wine"
          cp fex-dlls/libarm64ecfex.dll "$W/xtajit64.dll"
          cp fex-dlls/libwow64fex.dll "$W/xtajit.dll"
          ls -la "$W"/xtajit* "$U"/lib*fex.so
      - name: engine layout
        run: |
          set -euo pipefail
          mkdir -p out/renderers out/frameworks out/tools
          test -f out/engine/bin/wineserver
          # Wine Mono and Gecko, the versions this tree asks for; without them a bottle's first boot
          # stops at a prompt nothing unattended can answer. Mono is the arm64 package: wineboot and
          # Wine's other native arm64 processes register mscoree with its arm64 half, which looks for
          # bin/libmono-2.0-arm64.dll, and the x86 package has only the x86 and x86_64 builds, so every
          # new prefix showed the Mono installer (B1, measured 2026-10-12). The arm64 package carries all
          # three builds and the arm64 support tools. Gecko's x86 builds run through FEX.
          mono=$(sed -n 's/^#define MONO_VERSION "\(.*\)"/\1/p' src/wine-*/dlls/appwiz.cpl/addons.c)
          gecko=$(sed -n 's/^#define GECKO_VERSION "\(.*\)"/\1/p' src/wine-*/dlls/appwiz.cpl/addons.c)
          echo "addons: wine-mono $mono, wine-gecko $gecko"
          mkdir -p out/engine/share/wine/mono out/engine/share/wine/gecko
          curl -sSfL -o wine-mono.tar.xz "https://dl.winehq.org/wine/wine-mono/${mono}/wine-mono-${mono}-arm64.tar.xz"
          tar -xJf wine-mono.tar.xz -C out/engine/share/wine/mono
          for arch in x86 x86_64; do
            curl -sSfL -o "wine-gecko-${arch}.tar.xz" "https://dl.winehq.org/wine/wine-gecko/${gecko}/wine-gecko-${gecko}-${arch}.tar.xz"
            tar -xJf "wine-gecko-${arch}.tar.xz" -C out/engine/share/wine/gecko
          done
          # The host libraries Wine opens by leaf name (configure's SONAME_*: MoltenVK, FreeType,
          # GnuTLS, SDL), and what they link, in engine/lib: patches-arm64/0030 looks for them there
          # when a process has no DYLD variables (the children of a Windows program). Their Homebrew
          # install names become @loader_path ones, so they load from there with nothing set. SDL2
          # is sdl2-compat, which opens SDL3 at run time as @loader_path/libSDL3.dylib (then the same
          # name in the program's folder and the Frameworks folders), never as libSDL3.0.dylib: SDL3
          # goes along under that name too. Without it sdl2-compat shows an error dialog from
          # winedevice, which no one sees and which never returns, so winebus never finished starting
          # its SDL bus and never started IOHID: no joystick, yoke or gamepad reached any program on
          # this line until 2026-10-20.
          python3 - <<'PY'
          import os, re, shutil, subprocess
          conf = open("build/include/config.h").read()
          names = [re.search(r'#define SONAME_%s "([^"]+)"' % k, conf).group(1)
                   for k in ("LIBVULKAN", "LIBFREETYPE", "LIBGNUTLS", "LIBSDL2")]
          prefix = subprocess.run(["brew", "--prefix"], capture_output=True, text=True).stdout.strip()
          roots = [os.path.join(prefix, "lib", n) for n in names] + [os.path.join(prefix, "lib", "libSDL3.0.dylib")]
          dest = "out/engine/lib"
          # A dependency is a Homebrew path or an @rpath/ name (brotli's libbrotlidec links
          # @rpath/libbrotlicommon, resolved beside it or in Homebrew's lib): both are shipped and
          # rewritten to @loader_path; one that resolves nowhere fails the build.
          def deps(f):
              out = subprocess.run(["otool", "-L", f], capture_output=True, text=True).stdout.splitlines()[1:]
              res = []
              for l in out:
                  ref = l.split()[0]
                  if ref.startswith(("/opt/homebrew", "/usr/local")):
                      res.append((ref, ref))
                  elif ref.startswith("@rpath/"):
                      leaf = ref[len("@rpath/"):]
                      here = os.path.join(os.path.dirname(os.path.realpath(f)), leaf)
                      brew = os.path.join(prefix, "lib", leaf)
                      path = here if os.path.exists(here) else brew
                      assert os.path.exists(path), "unresolved @rpath dependency %s of %s" % (ref, f)
                      res.append((ref, path))
              return res
          todo, seen = list(roots), {}
          while todo:
              f = todo.pop()
              real = os.path.realpath(f)
              leaf = os.path.basename(f)
              if leaf in seen: continue
              seen[leaf] = real
              todo += [path for ref, path in deps(real)]
          for leaf, real in seen.items():
              d = os.path.join(dest, leaf)
              shutil.copy2(real, d); os.chmod(d, 0o755)
              subprocess.run(["install_name_tool", "-id", "@loader_path/" + leaf, d], check=True, stderr=subprocess.DEVNULL)
              for ref, path in deps(real):
                  subprocess.run(["install_name_tool", "-change", ref, "@loader_path/" + os.path.basename(path), d], check=True, stderr=subprocess.DEVNULL)
              subprocess.run(["codesign", "-f", "-s", "-", d], check=True, stderr=subprocess.DEVNULL)
          left = [ref for leaf in seen for ref, path in deps(os.path.join(dest, leaf))]
          assert not left, left
          for leaf in seen:
              r = subprocess.run(["python3", "-c", "import ctypes,sys; ctypes.CDLL(sys.argv[1])", os.path.join(dest, leaf)], capture_output=True, text=True)
              assert r.returncode == 0, "engine/lib/%s does not load: %s" % (leaf, r.stderr.strip()[-300:])
          os.symlink("libSDL3.0.dylib", os.path.join(dest, "libSDL3.dylib"))
          # Loading is not enough: sdl2-compat finds SDL3 in its constructor, and a missing SDL3 only
          # shows when it is used. SDL_Init(0) through it must succeed, with a timeout in case its
          # error dialog waits for an answer.
          check = ("import ctypes,sys; s=ctypes.CDLL(sys.argv[1]); s.SDL_GetError.restype=ctypes.c_char_p; "
                   "r=s.SDL_Init(0); sys.exit('SDL_Init failed: %s' % s.SDL_GetError().decode()) if r else s.SDL_Quit()")
          r = subprocess.run(["python3", "-c", check, os.path.join(dest, names[3])], capture_output=True, text=True, timeout=120)
          assert r.returncode == 0, "sdl2-compat cannot use the shipped SDL3: %s" % (r.stderr.strip()[-300:])
          print("host libraries in engine/lib:", sorted(seen), "+ libSDL3.dylib -> libSDL3.0.dylib")
          PY
          # winegstreamer.so looks for GStreamer at @loader_path/../../GStreamer.framework/Versions/1.0/lib,
          # that is engine/lib/GStreamer.framework. Highball links it to frameworks/ (EngineStore.linkRuntime);
          # the same link goes in the tarball so it works on its own. Every library it links must be shipped.
          ln -s ../../frameworks/GStreamer.framework out/engine/lib/GStreamer.framework
          for d in $(otool -L out/engine/lib/wine/aarch64-unix/winegstreamer.so | awk '/@rpath\/lib/ {print $1}'); do
            test -f "out/engine/lib/GStreamer.framework/Versions/1.0/lib/${d#@rpath/}" || { echo "not shipped: $d"; exit 1; }
          done
          echo "winegstreamer.so links: $(otool -L out/engine/lib/wine/aarch64-unix/winegstreamer.so | awk '/@rpath\/lib/ {printf "%s ", $1}')"
          # The Homebrew libraries the Unix side links (freetype, gnutls, sdl2 and what they pull
          # in), copied flat into frameworks/. Highball runs every Wine process with
          # DYLD_FALLBACK_LIBRARY_PATH on that directory, and dyld resolves an absolute install name
          # it cannot find by its leaf name there, so no install names are rewritten. The signed
          # loader allows DYLD variables (its entitlements), so they reach the process.
          python3 - <<'PY'
          import os, re, shutil, subprocess, glob
          todo = glob.glob("out/engine/lib/wine/aarch64-unix/*.so") + ["out/engine/bin/wineserver"]
          seen, copied = set(), []
          while todo:
              f = todo.pop()
              for line in subprocess.run(["otool", "-L", f], capture_output=True, text=True).stdout.splitlines()[1:]:
                  dep = line.split()[0]
                  if not dep.startswith("/opt/homebrew") and not dep.startswith("/usr/local"): continue
                  real = os.path.realpath(dep)
                  if real in seen: continue
                  seen.add(real)
                  dest = os.path.join("out/frameworks", os.path.basename(dep))
                  shutil.copy2(real, dest); os.chmod(dest, 0o755)
                  subprocess.run(["codesign", "-f", "-s", "-", dest], check=True)
                  copied.append(os.path.basename(dep)); todo.append(dest)
          print("bundled:", sorted(copied))
          PY
          # Strip debug info, as the Intel build does.
          before=$(du -sm out/engine | cut -f1)
          find out/engine/lib/wine/aarch64-windows out/engine/lib/wine/i386-windows \( -name '*.dll' -o -name '*.exe' -o -name '*.sys' -o -name '*.drv' -o -name '*.cpl' -o -name '*.ocx' -o -name '*.acm' -o -name '*.tlb' \) -type f ! -name 'xtajit*' -print0 \
            | xargs -0 -n 50 llvm-strip --strip-debug 2>/dev/null || true
          find out/engine/lib/wine/aarch64-unix -name '*.so' -type f ! -name 'lib*fex.so' -print0 | xargs -0 -n 50 strip -x -S 2>/dev/null || true
          echo "engine size: ${before} MB -> $(du -sm out/engine | cut -f1) MB"
          # The loader: Wine's link flags (4 KB segments) get the binary killed at exec on arm64, so
          # relink it the way Highball's signed one is linked, when this Xcode's linker can
          # (26.4 or later). Development only: the app never runs this file.
          if /usr/bin/clang -arch arm64 -o /tmp/layout-probe -x c - -Wl,-x86_64_layout_emulation <<<'int main(){return 0;}' 2>/dev/null; then
            MACOSX_DEPLOYMENT_TARGET=11.0 /usr/bin/clang -arch arm64 -mmacos-version-min=11.0 -o out/engine/lib/wine/aarch64-unix/wine build/loader/main.o \
              -Wl,-platform_version,macos,11.0,11.0,-pagezero_size,0x170000000,-image_base,0x170000000,-x86_64_layout_emulation,-sectcreate,__TEXT,__info_plist,build/loader/wine_info.plist
            echo "loader relinked with the arm64 layout"
          else
            echo "note: this Xcode's linker has no -x86_64_layout_emulation; the loader keeps Wine's flags and will not start on arm64 (Highball's own loader does)"
          fi
          version=$(sed -n 's/^#define PACKAGE_VERSION "\(.*\)"/\1/p' build/include/config.h)
          name="engine-arm64-wine-${version}-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.event.inputs.ref_note }}"
          tar -C out -czf "${name}.tar.gz" .
          shasum -a 256 "${name}.tar.gz" | tee "${name}.tar.gz.sha256"
          ls -la "${name}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-arm64
          path: |
            engine-arm64-*.tar.gz
            engine-arm64-*.tar.gz.sha256
          retention-days: 14
      - name: dev kit
        run: |
          set -euo pipefail
          tar -C sdk -czf wine-arm64-sdk.tar.gz include lib bin
          ls sdk/lib/wine; ls -la wine-arm64-sdk.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wine-arm64-sdk
          path: wine-arm64-sdk.tar.gz
          retention-days: 14
      - name: publish release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=$(ls engine-arm64-*.tar.gz | head -1)
          tag="${f%.tar.gz}"
          fex="FEX 2610 built with fex/patches/"
          if [ "$FEX_BUILD" = hangover ]; then fex="FEX (Hangover 11.16)"; fi
          gh release create "$tag" "$f" "$f.sha256" --title "$tag" --notes "Native arm64 Wine from the pinned upstream source (inputs-arm64.json) with the patch series in patches-arm64/ and $fex under Wine's emulator names. Runs through Highball's signed Wine loader only. No renderer overlay yet. Built by run ${{ github.run_id }}. Checksum in the .sha256 file."
