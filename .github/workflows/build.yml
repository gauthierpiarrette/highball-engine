# Builds the engine from the pinned CrossOver sources. Manual dispatch only until the first
# build is green and boots a bottle through Highball; nothing in the app points here yet.
name: build-engine
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the tarball as a GitHub release (tag engine-<wine version>-<date>)"
        type: boolean
        default: false
      ref_note:
        description: "why this build (free text, goes in the artifact name)"
        required: false
        default: "manual"
jobs:
  build:
    # Intel runner on purpose: the Unix side of this tree is x86_64 only (the Mac driver's
    # Metal layer class in d3dmetal_objc.h sits behind #if defined(__x86_64__)), as in
    # CrossOver's and Sikarugir's own builds. It runs under Rosetta on Apple Silicon.
    runs-on: macos-15-intel
    timeout-minutes: 300
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: pinned source
        run: |
          set -euo pipefail
          url=$(python3 -c 'import json;print(json.load(open("inputs.json"))["wine"]["url"])')
          sha=$(python3 -c 'import json;print(json.load(open("inputs.json"))["wine"]["sha256"])')
          curl -sSL -o crossover-sources.tar.gz "$url"
          echo "$sha  crossover-sources.tar.gz" | shasum -a 256 -c -
          mkdir -p src && tar -xzf crossover-sources.tar.gz -C src
          ls src/sources/wine | head -3
      - name: apply patch series
        run: |
          set -euo pipefail
          cd src/sources/wine
          for p in ../../../patches/*.patch; do [ -e "$p" ] || continue; echo "applying $p"; patch -p1 < "$p"; done
      - name: toolchain
        run: |
          set -euo pipefail
          brew install -q mingw-w64 bison pkg-config ccache gnutls freetype sdl2 libpng jpeg-turbo gstreamer molten-vk || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          x86_64-w64-mingw32-gcc --version | head -1
          i686-w64-mingw32-gcc --version | head -1
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('inputs.json', 'patches/**') }}
          restore-keys: ccache-${{ runner.os }}-
      # OpenGL is not passed explicitly: configure then treats the missing EGL headers
      # (there is no EGL on macOS) as a notice, and the Mac driver links OpenGL.framework.
      - name: configure and build
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          ../src/sources/wine/configure \
            --prefix="$PWD/../out/engine" \
            --enable-archs=i386,x86_64 \
            --with-mingw \
            --without-alsa --without-capi --with-coreaudio --without-cups --without-dbus \
            --without-fontconfig --with-freetype --with-gnutls --without-gphoto --with-gstreamer \
            --without-krb5 --without-netapi --without-oss --without-pulse \
            --without-sane --with-sdl --without-udev --without-usb --without-v4l2 --without-x \
            --disable-tests \
            CC="ccache clang" CXX="ccache clang++" \
            CROSSCC="ccache x86_64-w64-mingw32-gcc" \
            i386_CC="ccache i686-w64-mingw32-gcc" x86_64_CC="ccache x86_64-w64-mingw32-gcc"
          make -j"$(sysctl -n hw.ncpu)"
          make install-lib
      - name: engine layout
        run: |
          set -euo pipefail
          # Highball's engine layout: engine/{bin,lib,share}, renderers/, frameworks/, tools/, manifest.json
          mkdir -p out/renderers out/frameworks out/tools
          test -x out/engine/bin/wine
          out/engine/bin/wine --version || true
          # Wine Mono and Gecko, the versions this tree asks for (dlls/appwiz.cpl/addons.c).
          # Without them the first boot of a bottle stops at a "download Mono?" prompt that
          # nothing unattended can answer (found 2026-09-04). Sikarugir's engines ship both.
          mono=$(sed -n 's/^#define MONO_VERSION "\(.*\)"/\1/p' src/sources/wine/dlls/appwiz.cpl/addons.c)
          gecko=$(sed -n 's/^#define GECKO_VERSION "\(.*\)"/\1/p' src/sources/wine/dlls/appwiz.cpl/addons.c)
          echo "addons: wine-mono $mono, wine-gecko $gecko"
          mkdir -p out/engine/share/wine/mono out/engine/share/wine/gecko
          curl -sSfL -o wine-mono.tar.xz "https://dl.winehq.org/wine/wine-mono/${mono}/wine-mono-${mono}-x86.tar.xz"
          tar -xJf wine-mono.tar.xz -C out/engine/share/wine/mono
          for arch in x86 x86_64; do
            curl -sSfL -o "wine-gecko-${arch}.tar.xz" "https://dl.winehq.org/wine/wine-gecko/${gecko}/wine-gecko-${gecko}-${arch}.tar.xz"
            tar -xJf "wine-gecko-${arch}.tar.xz" -C out/engine/share/wine/gecko
          done
          ls out/engine/share/wine/mono out/engine/share/wine/gecko
          # Strip debug info: the PE builtins come out of the compile 5 to 7 times larger than
          # the ones Sikarugir ships (ntdll.dll 4.7 MB against 0.7 MB). Exports and the Unix
          # side's global symbols stay, which is what Wine's loader needs.
          before=$(du -sm out/engine | cut -f1)
          find out/engine/lib/wine/x86_64-windows out/engine/lib/wine/i386-windows \( -name '*.dll' -o -name '*.exe' -o -name '*.sys' -o -name '*.drv' -o -name '*.cpl' -o -name '*.ocx' -o -name '*.acm' -o -name '*.tlb' \) -type f -print0 \
            | xargs -0 -n 50 x86_64-w64-mingw32-strip --strip-debug 2>/dev/null || true
          find out/engine/lib/wine/x86_64-unix -name '*.so' -type f -print0 | xargs -0 -n 50 strip -x -S 2>/dev/null || true
          strip -x -S out/engine/bin/wine out/engine/bin/wineserver 2>/dev/null || true
          echo "engine size: ${before} MB -> $(du -sm out/engine | cut -f1) MB"
          out/engine/bin/wine --version
          name="engine-$(out/engine/bin/wine --version | tr ' ()' '-' | tr -s '-' | sed 's/-$//')-$(date -u +%Y%m%dT%H%M%SZ)-${{ github.event.inputs.ref_note }}"
          tar -C out -czf "${name}.tar.gz" .
          shasum -a 256 "${name}.tar.gz" | tee "${name}.tar.gz.sha256"
          ls -la "${name}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            engine-*.tar.gz
            engine-*.tar.gz.sha256
      - name: publish release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=$(ls engine-*.tar.gz | head -1)
          tag="${f%.tar.gz}"
          gh release create "$tag" "$f" "$f.sha256" --title "$tag" --notes "Wine from the pinned CrossOver source (inputs.json) with the patch series in patches/. Built by run ${{ github.run_id }}. Checksum in the .sha256 file."
          retention-days: 14
